<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能合同核对 Agent</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
    <style>
        body { background-color: #f8fafc; color: #334155; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
        }
        .btn-tech {
            background: linear-gradient(135deg, #2563eb 0%, #6366f1 100%);
            background-size: 200% auto;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.3);
        }
        .btn-tech:hover { background-position: right center; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }
        .btn-tech:active { transform: translateY(1px) scale(0.98); }
        .dropzone { transition: all 0.3s ease; }
        .dropzone:hover { border-color: #6366f1; background-color: #f8fafc; }
        .drag-active { border-color: #2563eb !important; background-color: #eff6ff !important; border-width: 2px;}
        .progress-bar {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
            background-size: 200% 200%;
            animation: gradientFlow 2s ease infinite;
            transition: width 0.4s ease-out;
        }
        @keyframes gradientFlow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        .result-card { transition: all 0.3s ease; }
        .result-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -6px rgba(0,0,0,0.08); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Tab Navigation */
        .tab-btn {
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: #4f46e5;
            border-bottom: 2px solid #4f46e5;
        }

        /* Markdown content */
        .markdown-content h1 { font-size: 1.5rem; font-weight: 700; margin-top: 1.2rem; margin-bottom: 0.6rem; color: #1e293b; }
        .markdown-content h2 { font-size: 1.25rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: #334155; }
        .markdown-content h3 { font-size: 1.1rem; font-weight: 600; margin-top: 0.8rem; margin-bottom: 0.4rem; }
        .markdown-content p { margin-bottom: 0.6rem; line-height: 1.8; }
        .markdown-content ul, .markdown-content ol { padding-left: 1.5rem; margin-bottom: 0.6rem; }
        .markdown-content table { border-collapse: collapse; width: 100%; margin: 0.8rem 0; font-size: 0.875rem; }
        .markdown-content th, .markdown-content td { border: 1px solid #e2e8f0; padding: 0.5rem 0.75rem; text-align: left; }
        .markdown-content th { background: #f8fafc; font-weight: 600; }
        .markdown-content code { background: #f1f5f9; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; }
        .markdown-content pre { background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .markdown-content pre code { background: none; padding: 0; }
        .markdown-content blockquote { border-left: 4px solid #e2e8f0; padding-left: 1rem; color: #64748b; margin: 0.8rem 0; }
    </style>
</head>
<body class="min-h-screen font-sans">

    <header class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 group cursor-pointer">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-md group-hover:rotate-12 transition-transform">
                    <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h1 class="text-xl font-bold text-gray-800">SmartReview <span class="font-light text-gray-500">Agent</span></h1>
            </div>
            <div class="flex items-center space-x-2 bg-white px-3 py-1.5 rounded-full border border-gray-200 shadow-sm" id="statusContainer">
                <span id="backendStatusDot" class="w-2.5 h-2.5 rounded-full bg-gray-300 relative"></span>
                <span id="backendStatusText" class="text-xs font-semibold text-gray-500">检测中...</span>
            </div>
        </div>
    </header>

    <main class="py-8 px-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 h-[calc(100vh-5rem)]">

        <div class="lg:col-span-4 flex flex-col h-full">
            <div class="glass-card rounded-2xl p-6 flex-1 overflow-y-auto">
                <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wider mb-5 flex items-center border-b border-gray-100 pb-3">
                    <svg class="w-4 h-4 mr-2 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    任务中心
                </h2>
                <form id="reviewForm" class="space-y-5">
                    <div class="space-y-4">
                        <div id="dropzoneProcurement" class="dropzone relative border-2 border-dashed border-gray-200 rounded-xl p-5 text-center cursor-pointer bg-gray-50/50">
                            <input type="file" id="procurementFile" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" required>
                            <div class="flex flex-col items-center pointer-events-none">
                                <div class="p-2 bg-blue-50 rounded-full text-blue-500 mb-1"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg></div>
                                <p class="text-sm font-semibold text-gray-700">导入 <span class="text-blue-600">采购要求</span></p>
                                <p id="procurementFileName" class="text-xs text-gray-400 mt-1">拖拽或点击上传</p>
                            </div>
                        </div>
                        <div id="dropzoneContract" class="dropzone relative border-2 border-dashed border-gray-200 rounded-xl p-5 text-center cursor-pointer bg-gray-50/50">
                            <input type="file" id="contractFile" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" required>
                            <div class="flex flex-col items-center pointer-events-none">
                                <div class="p-2 bg-indigo-50 rounded-full text-indigo-500 mb-1"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
                                <p class="text-sm font-semibold text-gray-700">导入 <span class="text-indigo-600">合同草案</span></p>
                                <p id="contractFileName" class="text-xs text-gray-400 mt-1">拖拽或点击上传</p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 rounded-xl p-4 border border-gray-100 space-y-3">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">分析引擎</label>
                            <select id="provider" class="w-full bg-white border border-gray-200 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none shadow-sm">
                                <option value="deepseek">DeepSeek AI</option>
                                <option value="minimax">MiniMax</option>
                                <option value="glm">智谱 GLM</option>
                            </select>
                        </div>
                        <div>
                            <button type="button" id="advancedToggle" onclick="toggleAdvanced()" class="flex items-center space-x-2 text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors">
                                <svg id="advancedArrow" class="w-3 h-3 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                <span>高级配置</span>
                            </button>
                            <div id="advancedConfig" class="hidden mt-3 space-y-3 border-t border-gray-200 pt-3">
                                <div>
                                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">API Key</label>
                                    <input type="password" id="apiKeyInput" placeholder="留空则使用服务端配置" autocomplete="off" class="w-full bg-white border border-gray-200 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none shadow-sm">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Model</label>
                                    <input type="text" id="modelInput" placeholder="留空则使用默认模型" class="w-full bg-white border border-gray-200 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none shadow-sm">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Temperature: <span id="tempDisplay" class="text-indigo-600">0.2</span></label>
                                    <div class="flex items-center space-x-3">
                                        <input type="range" id="temperatureSlider" min="0" max="2" step="0.1" value="0.2" oninput="updateTempDisplay()" class="flex-1 accent-indigo-500">
                                        <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded" id="tempValueLabel">0.2</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button id="submitBtn" type="submit" class="w-full btn-tech text-white font-bold py-3.5 px-4 rounded-xl text-sm shadow-md">
                        启动深度审核分析
                    </button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-8 flex flex-col h-full glass-card rounded-2xl overflow-hidden relative">

            <div id="idleState" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 bg-white/80 z-10">
                <svg class="w-16 h-16 text-gray-200 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-sm font-medium">请在左侧上传文件并启动任务</p>
            </div>

            <div id="loadingState" class="hidden absolute inset-0 bg-white/95 backdrop-blur-md z-20 flex flex-col items-center justify-center p-8">
                <div class="w-full max-w-lg">
                    <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                        <svg class="w-6 h-6 mr-2 text-indigo-500 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        AI 深度分析引擎运行中
                    </h3>

                    <div class="relative pl-6 border-l-2 border-indigo-100 space-y-6 mb-8" id="progressSteps">
                        <div class="relative">
                            <span class="absolute -left-[31px] w-4 h-4 rounded-full bg-indigo-500 ring-4 ring-white"></span>
                            <p class="text-sm font-bold text-gray-800">构建双文档向量索引...</p>
                        </div>
                        <div class="relative opacity-40 transition-opacity duration-500" id="step2">
                            <span class="absolute -left-[31px] w-4 h-4 rounded-full bg-gray-300 ring-4 ring-white" id="step2Dot"></span>
                            <p class="text-sm font-bold text-gray-800">提取采购强制性条款...</p>
                        </div>
                        <div class="relative opacity-40 transition-opacity duration-500" id="step3">
                            <span class="absolute -left-[31px] w-4 h-4 rounded-full bg-gray-300 ring-4 ring-white" id="step3Dot"></span>
                            <p class="text-sm font-bold text-gray-800">交叉对比合同草案内容...</p>
                        </div>
                    </div>

                    <div class="flex justify-between items-end mb-2">
                        <p class="text-xs font-bold text-gray-500 uppercase">总体进度</p>
                        <span id="loadingPercent" class="text-lg font-black text-indigo-600">0%</span>
                    </div>
                    <div class="w-full h-4 bg-gray-100 rounded-full overflow-hidden shadow-inner">
                        <div id="progressBar" class="h-full progress-bar w-0 rounded-full relative"></div>
                    </div>
                </div>
            </div>

            <div id="errorState" class="hidden absolute inset-0 bg-white/95 z-20 flex flex-col items-center justify-center">
                <p id="errorText" class="text-sm text-red-500 bg-red-50 p-4 rounded-lg border border-red-100"></p>
            </div>

            <!-- Report Content -->
            <div id="reportContent" class="hidden h-full flex-col bg-white">
                <!-- Tab Navigation -->
                <div class="flex border-b border-gray-200 bg-white px-4 pt-2 gap-1 overflow-x-auto">
                    <button class="tab-btn active flex items-center px-3 py-2.5 text-sm font-medium text-gray-600 border-b-2 border-transparent whitespace-nowrap" data-tab="summary" onclick="switchTab('summary')">审核摘要</button>
                    <button class="tab-btn flex items-center px-3 py-2.5 text-sm font-medium text-gray-600 border-b-2 border-transparent whitespace-nowrap" data-tab="missing" onclick="switchTab('missing')">缺失项 <span class="ml-1 text-xs font-bold px-1.5 py-0.5 rounded-full bg-rose-50 text-rose-600" id="missingTabCount">0</span></button>
                    <button class="tab-btn flex items-center px-3 py-2.5 text-sm font-medium text-gray-600 border-b-2 border-transparent whitespace-nowrap" data-tab="discrepancy" onclick="switchTab('discrepancy')">矛盾项 <span class="ml-1 text-xs font-bold px-1.5 py-0.5 rounded-full bg-amber-50 text-amber-600" id="discrepancyTabCount">0</span></button>
                    <button class="tab-btn flex items-center px-3 py-2.5 text-sm font-medium text-gray-600 border-b-2 border-transparent whitespace-nowrap" data-tab="consistent" onclick="switchTab('consistent')">一致项 <span class="ml-1 text-xs font-bold px-1.5 py-0.5 rounded-full bg-emerald-50 text-emerald-600" id="consistentTabCount">0</span></button>
                    <button class="tab-btn flex items-center px-3 py-2.5 text-sm font-medium text-gray-600 border-b-2 border-transparent whitespace-nowrap" data-tab="fullreport" onclick="switchTab('fullreport')">完整报告</button>
                </div>

                <!-- Tab Panels -->
                <div class="flex-1 overflow-y-auto">
                    <!-- Summary Tab -->
                    <div class="tab-panel active p-6" data-panel="summary" id="panelSummary">
                        <div class="prose prose-sm max-w-none text-gray-700 leading-relaxed whitespace-pre-wrap" id="summaryText"></div>
                        <div class="grid grid-cols-3 gap-4 mt-6" id="statsGrid">
                            <div class="bg-rose-50 border border-rose-100 rounded-xl p-4 text-center">
                                <div class="text-2xl font-black text-rose-600" id="statMissing">0</div>
                                <div class="text-xs font-bold text-rose-500 mt-1">缺失项</div>
                            </div>
                            <div class="bg-amber-50 border border-amber-100 rounded-xl p-4 text-center">
                                <div class="text-2xl font-black text-amber-600" id="statDiscrepancy">0</div>
                                <div class="text-xs font-bold text-amber-500 mt-1">矛盾项</div>
                            </div>
                            <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4 text-center">
                                <div class="text-2xl font-black text-emerald-600" id="statConsistent">0</div>
                                <div class="text-xs font-bold text-emerald-500 mt-1">一致项</div>
                            </div>
                        </div>
                    </div>

                    <!-- Missing Items Tab -->
                    <div class="tab-panel hidden p-6" data-panel="missing" id="panelMissing">
                        <div id="missingItemsContainer" class="space-y-3"></div>
                        <div id="missingEmpty" class="hidden text-center text-gray-400 py-12 text-sm">无缺失项</div>
                    </div>

                    <!-- Discrepancy Items Tab -->
                    <div class="tab-panel hidden p-6" data-panel="discrepancy" id="panelDiscrepancy">
                        <div id="discrepancyItemsContainer" class="space-y-3"></div>
                        <div id="discrepancyEmpty" class="hidden text-center text-gray-400 py-12 text-sm">无矛盾项</div>
                    </div>

                    <!-- Consistent Items Tab -->
                    <div class="tab-panel hidden p-6" data-panel="consistent" id="panelConsistent">
                        <div id="consistentItemsContainer" class="space-y-2"></div>
                        <div id="consistentEmpty" class="hidden text-center text-gray-400 py-12 text-sm">无一致项</div>
                    </div>

                    <!-- Full Report Tab -->
                    <div class="tab-panel hidden p-6" data-panel="fullreport" id="panelFullreport">
                        <div class="markdown-content" id="fullReportContent"></div>
                    </div>
                </div>

                <!-- Toolbar -->
                <div class="flex justify-end items-center gap-2 px-6 py-3 border-t border-gray-100 bg-gray-50/50">
                    <button id="exportMdBtn" class="px-3 py-2 text-xs font-bold text-indigo-600 bg-indigo-50 border border-indigo-100 rounded-lg hover:bg-indigo-100 transition-all">导出 Markdown</button>
                    <button id="exportJsonBtn" class="px-3 py-2 text-xs font-bold text-gray-600 bg-gray-50 border border-gray-200 rounded-lg hover:bg-gray-100 transition-all">导出 JSON</button>
                    <button id="exportVerifiedBtn" class="px-3 py-2 text-xs font-bold text-emerald-600 bg-emerald-50 border border-emerald-100 rounded-lg hover:bg-emerald-100 transition-all">导出核验结果</button>
                </div>
            </div>

        </div>
    </main>
    <script src="/web/app.js"></script>
</body>
</html>
