name: Verify source and JSON parsing

on:
  push:
  pull_request:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m compileall -q contract_review_agent fastapi_app.py mineru_markdown_converter.py run_contract_review_agent.py bootstrap_mineru.py
      - run: python -m unittest discover -s tests -v
